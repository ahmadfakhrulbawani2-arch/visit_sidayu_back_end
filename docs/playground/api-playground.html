<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Sidayu API Playground</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --accent-color: #0f172a;
        --success-color: #10b981;
        --error-color: #ef4444;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 24px;
        line-height: 1.5;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin-top: 0;
        font-size: 1.8rem;
        color: var(--accent-color);
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 12px;
        margin-bottom: 24px;
      }
      h2 {
        font-size: 1.2rem;
        margin-top: 0;
        color: var(--accent-color);
      }
      .card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 10px;
        margin: 16px 0;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid #e2e8f0;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 4px;
        color: #475569;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px 12px;
        margin: 6px 0 16px 0;
        box-sizing: border-box;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.95rem;
        background-color: #fff;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 6px;
        width: 100%;
      }
      button:hover {
        background-color: var(--primary-hover);
      }
      pre {
        background: #0f172a;
        color: #38bdf8;
        padding: 16px;
        border-radius: 6px;
        overflow: auto;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        max-height: 400px;
      }
      .row {
        display: flex;
        gap: 16px;
      }
      .row > div {
        flex: 1;
      }
      .help-text {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: -12px;
        margin-bottom: 12px;
      }
      #status {
        font-weight: 600;
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 4px;
        background-color: #f1f5f9;
        display: inline-block;
      }
      .success {
        color: var(--success-color);
        background-color: #d1fae5 !important;
      }
      .error {
        color: var(--error-color);
        background-color: #fee2e2 !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Visit Sidayu API Playground</h1>

      <div class="card">
        <h2>Configuration</h2>
        <div class="row">
          <div>
            <label>Base URL</label>
            <input id="base" value="http://localhost:8080/api/v1" />
          </div>
          <div>
            <label>JWT Token</label>
            <input
              id="token"
              placeholder="Bearer token (tanpa prefix Bearer)"
            />
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Request Builder</h2>
        <div class="row">
          <div>
            <label>Method</label>
            <select id="method">
              <option>GET</option>
              <option>POST</option>
              <option>PATCH</option>
              <option>PUT</option>
              <option>DELETE</option>
            </select>
          </div>
          <div>
            <label>Endpoint</label>
            <input id="endpoint" placeholder="/blogs" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Path Suffix (opsional)</label>
            <input
              id="suffix"
              placeholder="cth: /id/uuid-anda atau kosongkan"
            />
          </div>
          <div>
            <label>Query Parameters (opsional)</label>
            <input
              id="queryParams"
              placeholder="cth: search=test&limit=1&page=1"
            />
          </div>
        </div>

        <label>Content Type</label>
        <select id="ctype">
          <option value="json">application/json</option>
          <option value="form">multipart/form-data</option>
        </select>

        <div id="jsonbox">
          <label>JSON Body</label>
          <textarea id="body" rows="6">
{
  "example": "value"
}</textarea>
        </div>

        <div id="formbox" style="display: none">
          <label>File</label>
          <input type="file" id="file" />
        </div>

        <button type="button" id="sendBtn">Send Request</button>
      </div>

      <div class="card">
        <h2>Response</h2>
        <div id="status">Status: Ready</div>
        <pre id="resp">{}</pre>
      </div>
    </div>

    <script>
      const ctype = document.getElementById("ctype");
      ctype.addEventListener("change", () => {
        document.getElementById("jsonbox").style.display =
          ctype.value === "json" ? "block" : "none";
        document.getElementById("formbox").style.display =
          ctype.value === "form" ? "block" : "none";
      });

      document.getElementById("sendBtn").addEventListener("click", async () => {
        const t0 = performance.now();
        const statusEl = document.getElementById("status");
        statusEl.className = "";
        statusEl.textContent = "Sending request...";

        try {
          const base = document
            .getElementById("base")
            .value.trim()
            .replace(/\/+$/, "");
          let endpoint = document.getElementById("endpoint").value.trim();
          let suffix = document.getElementById("suffix").value.trim();
          let queryParams = document.getElementById("queryParams").value.trim();

          // Pastikan endpoint diawali garis miring dan bersihkan trailing slash
          if (!endpoint.startsWith("/")) endpoint = "/" + endpoint;
          endpoint = endpoint.replace(/\/+$/, "");

          if (suffix) {
            if (!suffix.startsWith("/")) suffix = "/" + suffix;
            suffix = suffix.replace(/\/+$/, "");
          }

          if (queryParams.startsWith("?")) {
            queryParams = queryParams.substring(1);
          }

          let url = base + endpoint + suffix;
          if (queryParams) {
            url += "?" + queryParams;
          }

          console.log("FINAL URL TARGET:", url);

          const method = document.getElementById("method").value;
          const token = document.getElementById("token").value.trim();
          const headers = {};
          if (token) headers.Authorization = "Bearer " + token;

          let opts = { method, headers };
          if (method !== "GET" && method !== "DELETE") {
            if (ctype.value === "json") {
              headers["Content-Type"] = "application/json";
              opts.body = document.getElementById("body").value;
            } else {
              const fd = new FormData();
              const f = document.getElementById("file").files[0];
              if (f) fd.append("image", f);
              opts.body = fd;
            }
          }

          const res = await fetch(url, opts);
          const txt = await res.text();
          let out = txt;
          try {
            out = JSON.stringify(JSON.parse(txt), null, 2);
          } catch (e) {}

          const duration = (performance.now() - t0).toFixed(1);
          statusEl.textContent = `${res.status} ${res.statusText || "OK"} | ${duration} ms`;
          statusEl.className = res.ok ? "success" : "error";
          document.getElementById("resp").textContent = out;
        } catch (e) {
          console.error("FETCH ERROR:", e);
          statusEl.textContent = "Request Failed (Cek Console F12)";
          statusEl.className = "error";
          document.getElementById("resp").textContent = e.toString();
        }
      });
    </script>
  </body>
</html>
